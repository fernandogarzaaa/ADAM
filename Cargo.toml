[workspace]
resolver = "2"
members = [
    "crates/adam-kernel",
    "crates/adam-memory",
    "crates/adam-skills",
    "crates/adam-beliefs",
    "crates/adam-evolution",
    "crates/adam-eve",
    "crates/adam-organism",
    "crates/adam-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ADAM Project Contributors"]
repository = "https://github.com/adam-project/adam"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
